description: 'Tile is a consumer-electronics company known for its Bluetooth tracker
  devices, used to locate everyday items such as keys, wallets, bags, and phones through
  a companion mobile app and a crowd-sourced Find network. Tile was acquired by Life360
  in 2021; its former site thetileapp.com now 301-redirects to life360.com. Surfaced
  as a portfolio company of Bessemer Venture Partners, Tile publishes no public developer
  API — this profile captures its security posture (security.txt, a HackerOne responsible-disclosure
  program, and probed domain security).'
